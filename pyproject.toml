# Ruff config only; dependencies live in requirements/*.txt.

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "DJ",   # flake8-django
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "B904",    # DRF errors raised from narrow guards; chaining the original adds nothing
    "DJ001",   # some CharFields are nullable to match the legacy schema
    "SIM102",  # keep separate guard clauses, one reason per branch
    "SIM108",  # prefer if/else blocks over ternaries
]

[tool.ruff.lint.isort]
# stdlib -> Django -> third-party -> apps.*
known-first-party = ["apps", "config"]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.ruff.format]
# The codebase mixes single and double quotes; normalising would rewrite thousands of lines.
quote-style = "preserve"
