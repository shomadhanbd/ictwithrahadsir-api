# The API host: nginx terminates TLS, serves uploaded files and passes everything else to gunicorn.
# Install in /etc/nginx/sites-available/, link it from sites-enabled, then `nginx -t` and reload.
# Replace api.example.com, the certificate paths and /srv/shomadhan/media with the real values.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # Above the largest upload Django accepts (a 20 MB PDF), so Django gives the error, not nginx.
    client_max_body_size 25m;

    # Uploaded files, straight from disk; the same folder as MEDIA_ROOT in .env.
    location /media/ {
        alias /srv/shomadhan/media/;
        limit_except GET HEAD { deny all; }
        autoindex off;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    # The API and Django's /admin; production reads the scheme from X-Forwarded-Proto.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
