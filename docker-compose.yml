services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ictwithrahadsir
      POSTGRES_USER: ictwithrahadsir
      POSTGRES_PASSWORD: ictwithrahadsir
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      # Production settings force TLS redirects on; this compose file serves
      # plain HTTP on :8000, so turn it off here.
      SECURE_SSL_REDIRECT: "False"
      DATABASE_URL: postgres://ictwithrahadsir:ictwithrahadsir@db:5432/ictwithrahadsir
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-True}
      SMS_BACKEND: ${SMS_BACKEND:-console}
    depends_on:
      - db

volumes:
  postgres_data:
  media_data:
  static_data:
